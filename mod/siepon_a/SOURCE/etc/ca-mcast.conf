
#                                the config item default value table in SFU and G3, this table will recover ca-mcast module initial value
#-------------------------------|-------------------|-------------------|----------------------------------------------------------------------|
#          item name            |         SFU       |         G3        |                            comments                                  |
#-------------------------------|-------------------|-------------------|----------------------------------------------------------------------|
#          mode                 |                   2                   |  0 - disable, 1 - proxy, 2 - snooping                                |
#-------------------------------|---------------------------------------|----------------------------------------------------------------------|
#        l3_mc_route            |         0         |         1         |  1:add L3 mc entry when add a group, 0:not add L3 mc entry           |
#-------------------------------|-------------------|-------------------|----------------------------------------------------------------------|
#        register_igmp          |         1         |         0         |  1:receive igmp and handle igmp frame,                               |
#                               |                   |                   |  0:not receive igmp frame in IGMP snooping                           |
#-------------------------------|-------------------|-------------------|----------------------------------------------------------------------|
#        register_mld           |         1         |         1         |  1:receive mld and handle igmp frame,                                |
#                               |                   |                   |  0:not receive igmp frame in IGMP snooping                           |
#-------------------------------|-------------------|-------------------|----------------------------------------------------------------------|
#        discard_ex_record      |         0         |         1         |  1:discard exclude record, 0:handle exclude record                   |
#-------------------------------|-------------------|-------------------|----------------------------------------------------------------------|
#        discard_to_ex_record   |         0         |         1         |  1:discard to_ex_record , 0:handle to_ex_record                      |
#-------------------------------|-------------------|-------------------|----------------------------------------------------------------------|
#        discard_to_in_record   |         0         |         1         |  1:discard to_in_record, 0:handle to_in_record                       |
#-------------------------------|-------------------|-------------------|----------------------------------------------------------------------|
#        host_portid            |   0x20007(EPON)   |     0x30007       |  1:add L3 mc entry when add a group, 0:not add L3 mc entry           |
#                               |   0x10007(GPON)   |                   |                                                                      |
#-------------------------------|-------------------|-------------------|----------------------------------------------------------------------|
#        forward_report         |         1         |         0         |  1:forward report to host port, 0:not forward report                 |
#-------------------------------|-------------------|-------------------|----------------------------------------------------------------------|
#        forward_query          |         1         |         0         |  1:forward query to host port, 0:not forward query                   |
#-------------------------------|-------------------|-------------------|----------------------------------------------------------------------|
#        max_grp_num            |                  255                  |  (0, 512), onu based , this value is limited by hardware chip        |
#-------------------------------|---------------------------------------|----------------------------------------------------------------------|
#       query_rsp_interval      |                  10                   | fdb age timer = robustness * query_interval                          |
#                               |                                       |                 + query_rsp_interval = 260 (second)                  |
#-------------------------------|---------------------------------------|----------------------------------------------------------------------|
#       query_interval          |                  125                  |  unit second                                                         |
#-------------------------------|---------------------------------------|----------------------------------------------------------------------|
#       last_member_query_count |                  2                    |  unit second                                                         |
#-------------------------------|---------------------------------------|----------------------------------------------------------------------|
#    last_member_query_interval |                  1                    |  unit second                                                         |
#-------------------------------|---------------------------------------|----------------------------------------------------------------------|
#      robustness               |                  2                    |                                                                      |
#-------------------------------|---------------------------------------|----------------------------------------------------------------------|
#     portid_attr_scope         |                 0xffffffff            | (0x30000, 0x30004) or 0xffffffff LAN port,                           |
#                               |                                       |  portid= 0xffffffff means this attribute apply on all ports.         |
#-------------------------------|---------------------------------------|----------------------------------------------------------------------|
#     mc_convert_uc             |                 0                     |  1: enable port mc_to_uc conversion ,                                |
#                               |                                       |     must eanble host_tracking  before enable mc_to_uc conversion     |
#                               |                                       |  0: enable port mc_to_uc conversion                                  |
#-------------------------------|---------------------------------------|----------------------------------------------------------------------|
#    host_tracking              |                 0                     |  1:enable port host tracking, 0:disable port host tracking           |
#-------------------------------|---------------------------------------|----------------------------------------------------------------------|
#    leave_mode                 |                 0                     |  1: port fast-leave mode, 0:port non-fast-leave mode                 |
#-------------------------------|---------------------------------------|----------------------------------------------------------------------|
#    max_host_per_group         |                 64                    |  0-64, it is valid when  enable port host tracking                   |
#-------------------------------|---------------------------------------|----------------------------------------------------------------------|
#    port_max_grp_num           |                128                    |                                                                      |             
#-------------------------------|---------------------------------------|----------------------------------------------------------------------|
#    igmp_version_level         |                2                      |  1:igmpv1, 2:igmpv2, 3:igmpv3                                        |
#-------------------------------|------------------|--------------------|----------------------------------------------------------------------|
#    mld_version_level          |        4         |        5           |  4:mldv1, 5:mldv2                                                    |
#-------------------------------|------------------|--------------------|----------------------------------------------------------------------|

#create_ca_mcast_thread         = 0
mode                            = 2               
#l3_mc_route                    = 0
#register_igmp                  = 1
register_mld                    = 1
#discard_ex_record              = 1
#discard_to_ex_record           = 1
#discard_to_in_record           = 1
#host_portid                    = 0x30007
#forward_report                 = 1
#forward_query                  = 1
#disable_acl_check_gernal_query_vlan   = 0
#compatible_prev_version               = 0

max_grp_num                     = 255
query_rsp_interval              = 10
query_interval                  = 125
last_member_query_count         = 2
last_member_query_interval      = 1
robustness                      = 2 


portid_attr_scope               = 0xffffffff
mc_convert_uc                   = 0
host_tracking                   = 0
leave_mode                      = 1
max_host_per_group              = 64
port_max_grp_num                = 255
igmp_version_level              = 2
#mld_version_level              = 5

#portid_attr_scope              = 0x30004
#mc_convert_uc                  = 0
