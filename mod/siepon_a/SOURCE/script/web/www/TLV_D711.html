<html>
<body>

<h2>Vendor Name (D7/11)</h2>
<hr>
<p>Configure the ONU Vendor Name.<br>
  The configured value will be reported to the OLT as the DPoE TLV D7/0011 value.</p>

<form method="POST" action="cgi-bin/set_TLV_D711_set.sh">
  ONU Vendor Name (ASCII Max 14 chars. If no input is provided, NULL will be reported to OLT)<br>
  Vendor Name : <input type="text" id="Name" name="Name" pattern="^[\x20-\x7E]*$" maxlength="14"><br>
  <br>
  <input type="submit" value="Save">
</form>

<script>
fetch("cgi-bin/set_TLV_D711_get.sh")
  .then(res => res.json())
  .then(data => {
    if (data.Name)  document.getElementById("Name").value = data.Name;
  })
  .catch(err => console.error(err));
</script>
<script src="save.js"></script>

</body>
</html>
